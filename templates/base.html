<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Job Search Dashboard{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Custom styles -->
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>

<body>

<!-- ── Sidebar ─────────────────────────────────────────────────────────────── -->
<div class="sidebar d-flex flex-column">
  <div class="sidebar-brand">
    <i class="bi bi-robot"></i>
    <span>Job Agent</span>
  </div>

  <nav class="sidebar-nav flex-grow-1">
    <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="{{ url_for('pipeline_page') }}" class="nav-link {% if request.endpoint == 'pipeline_page' %}active{% endif %}">
      <i class="bi bi-kanban"></i> My Pipeline
    </a>
    <a href="{{ url_for('jobs_page') }}" class="nav-link {% if request.endpoint == 'jobs_page' %}active{% endif %}">
      <i class="bi bi-briefcase"></i> All Jobs
    </a>
    <a href="/api/refresh" class="nav-link">
      <i class="bi bi-arrow-clockwise"></i> Refresh Data
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="https://github.com/dpgit07/job-search-agent" target="_blank" class="nav-link">
      <i class="bi bi-github"></i> View on GitHub
    </a>
  </div>
</div>

<!-- ── Main content ─────────────────────────────────────────────────────────── -->
<div class="main-content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
