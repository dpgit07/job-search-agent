name: Daily Job Scan

on:
  schedule:
    # 8 AM Eastern (13:00 UTC) on weekdays
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write  # needed to commit job_tracker.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run job scanner
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/scan_jobs.py

      - name: Commit updated tracker
        run: |
          git config user.name  "Job Search Bot"
          git config user.email "bot@job-search-agent.local"
          git add data/job_tracker.json
          # Only commit if there are actual changes to the tracker
          if git diff --cached --quiet; then
            echo "No new jobs found — tracker unchanged, nothing to commit."
          else
            git commit -m "chore: daily scan $(date -u +%Y-%m-%d) [skip ci]"
            # Pull remote changes first to avoid non-fast-forward push errors
            git pull --rebase origin main
            git push
          fi
